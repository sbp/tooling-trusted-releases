name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "actions" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@267c4672a565967e4531438f2498370de5e8a98d
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          packs: codeql/python-queries:AlertSuppression.ql
          config-file: ./codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@267c4672a565967e4531438f2498370de5e8a98d
        with:
          category: "/language:${{ matrix.language }}"

      - name: Dismiss alerts
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@29b55573401eedd7f600e4c3e5d0676a457b9f23
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/${{ matrix.language }}.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
